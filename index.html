<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- Iconos: este repositorio no incluye los logos de ExcaliClaw (marca no licenciada).
       Añade los tuyos en public/ (favicon.ico, favicon.png, apple-touch-icon.png) y enlázalos aquí. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ExcaliClaw</title>
</head>

<body>
  <div id="root"></div>
  <script>
    (function () {
      if (typeof window.EXCALIDRAW_ASSET_PATH === "string" && window.EXCALIDRAW_ASSET_PATH.length > 0) return;
      var base = "%BASE_URL%";
      if (base === "%BASE_URL%") base = "/";
      if (base && base[base.length - 1] !== "/") base += "/";
      window.EXCALIDRAW_ASSET_PATH = new URL(base || "/", window.location.origin).toString();
    })();
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
